services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resolveiq
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./db:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveiq -d resolveiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant: v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
volumes:
  postgres_data:
  qdrant_data:
